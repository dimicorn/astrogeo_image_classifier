[project]
name = "vis"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "astropy>=7.1.1",
    "ipykernel>=7.1.0",
    "matplotlib>=3.10.7",
    "munch>=4.0.0",
    "numpy>=2.3.4",
    "opencv-python>=4.11.0.86",
    "pandas>=2.3.3",
    "pillow>=12.0.0",
    "pre",
    "psycopg2>=2.9.11",
    "pyyaml>=6.0.3",
    "scipy>=1.17.0",
    "tabulate>=0.9.0",
    "tqdm>=4.67.1",
]

[dependency-groups]
dev = [
    "ruff>=0.14.5",
]

[tool.uv.workspace]
members = [
    "pre",
]

[tool.uv.sources]
pre = { git = "https://github.com/dimicorn/jet_garden_pre.git" }
